[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firmware-security-analyzer"
version = "0.1.2"
description = "Defensive static analysis toolkit for firmware images"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "FSA contributors"}]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "httpx>=0.27"]
lint = ["ruff>=0.4"]
yara = ["yara-python>=4.3"]

[project.scripts]
fsa = "fsa.cli:main"
fsa-web = "fsa.gui:main"

[project.gui-scripts]
fsa-gui = "fsa.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
fsa = ["templates/*.html", "assets/*", "assets/openwrt/*.json"]
