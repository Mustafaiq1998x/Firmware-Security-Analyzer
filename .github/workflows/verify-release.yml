name: VirusTotal release reports
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to scan
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: vt-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install httpx==0.28.1
      - name: Download public release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^[[:alnum:]][[:alnum:]._-]*$ ]]
          [[ "$(gh repo view "$GH_REPO" --json visibility --jq .visibility)" == PUBLIC ]]
          gh release view "$TAG" --json assets,body,isDraft > "$RUNNER_TEMP/release.json"
          jq -e '.isDraft == false' "$RUNNER_TEMP/release.json" > /dev/null
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets"
      - name: Verify package digests and collect completed analyses
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [[ -z "$VT_API_KEY" ]]; then echo "::error::Set the VT_API_KEY repository secret"; exit 1; fi
          python scripts/verify_release.py "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/assets" "$RUNNER_TEMP/notes.md"
      - name: Publish reports with the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json assets,body,isDraft > "$RUNNER_TEMP/current.json"
          fields='{body,isDraft,assets:[.assets[]|{name,digest,size,id}]}'
          diff <(jq -S "$fields" "$RUNNER_TEMP/release.json") <(jq -S "$fields" "$RUNNER_TEMP/current.json")
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
