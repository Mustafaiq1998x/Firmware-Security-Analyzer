name: Publish desktop release
on:
  push:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-desktop
  cancel-in-progress: false
jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/windows-desktop.yml
  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: FSA-Windows-x64
          path: windows
      - name: Test and assemble release files
        run: |
          python -m pip install '.[dev,web]' build
          python -m pytest -q
          version=$(python -c 'from importlib.metadata import version; print(version("firmware-security-analyzer"))')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          (cd windows && sha256sum -c SHA256SUMS.txt)
          mkdir bundle
          cp windows/FSA.exe bundle/
          (cd windows && zip -q ../bundle/FSA-Windows-x64.zip FSA.exe LICENSE.txt SHA256SUMS.txt)
          git archive --prefix="FSA-$version/" -o "bundle/FSA-$version-source.zip" HEAD
          python -m build --outdir bundle
          (cd bundle && sha256sum * > SHA256SUMS.txt)
      - name: Publish GitHub Release
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -1 "$tag")" = "$GITHUB_SHA"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Firmware Security Analyzer $VERSION" --notes "Download FSA.exe for Windows x64, or choose the source ZIP, Python wheel or source distribution. Verify downloads against SHA256SUMS.txt."
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$tag" bundle/* --clobber
            gh release edit "$tag" --draft=false
          else
            mkdir published
            gh release download "$tag" --dir published
            (cd published && sha256sum -c SHA256SUMS.txt)
            for file in bundle/*; do test -s "published/${file#bundle/}"; done
            rm -r bundle
            mv published bundle
          fi
      - name: Publish matching files to GitHub Packages
        run: |
          package="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$package" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$VERSION" -f - bundle <<'DOCKERFILE'
          FROM scratch
          COPY . /downloads/
          DOCKERFILE
          docker push "$package"
